<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>TRACKYZZ — Site en construction</title>
    <style>
        :root {
            --fond: #f6f7f9;
            --carte: #ffffff;
            --texte: #1d2129;
            --discret: #5b6372;
            --accent: #0a8f7a;
            --bord: #e1e4ea;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fond: #0f111a;
                --carte: #1a1c29;
                --texte: #eef0f5;
                --discret: #a3a9b8;
                --accent: #00d6ae;
                --bord: #2a2e43;
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--fond);
            color: var(--texte);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        main {
            width: 100%;
            max-width: 560px;
            background: var(--carte);
            border: 1px solid var(--bord);
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
        }
        .marque {
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--accent);
            font-size: 0.95rem;
        }
        h1 {
            font-size: 1.6rem;
            margin: 12px 0 8px;
        }
        p { margin: 8px 0; color: var(--discret); }
        .note {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--bord);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="marque">TRACKYZZ</div>
        <h1>Site en construction</h1>
        <p>Nous préparons une nouvelle version de TRACKYZZ.</p>
        <p>Aucun service n'est proposé pour le moment, et aucun paiement n'est possible sur ce site.</p>
        <p class="note">Merci de votre patience.</p>
    </main>
</body>
</html>
